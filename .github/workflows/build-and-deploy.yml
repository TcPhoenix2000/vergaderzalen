name: Build and Deploy to GitHub Pages

on:
  schedule:
    # Elk half uur, 04:00-17:59 UTC (= 06:00-19:59 zomer / 05:00-18:59 winter in Brussel).
    # Minuten 7 en 37 i.p.v. 0/30: op het volle en halve uur worden GitHub-crons het vaakst vertraagd of overgeslagen.
    - cron: "7,37 4-17 * * *"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Generate static HTML
        run: node generate_page.js

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          publish_branch: gh-pages
          force_orphan: true
