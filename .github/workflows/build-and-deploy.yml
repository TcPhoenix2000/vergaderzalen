name: Deploy to GitHub Pages

# De pagina haalt de data zelf live op in de browser, dus geen cron meer nodig:
# enkel opnieuw deployen wanneer de code wijzigt.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Collect site files
        run: |
          mkdir _site
          cp -r index.html css js _site/

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          publish_branch: gh-pages
          force_orphan: true
