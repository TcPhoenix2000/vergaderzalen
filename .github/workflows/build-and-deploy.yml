name: Build and Deploy to GitHub Pages

on:
  schedule:
    - cron: "*/10 * * * 1-5"  # Every hour, every day
  workflow_dispatch:       # Handmatig triggerbaar

permissions:
  contents: write
  
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install node-fetch@2
      - name: Install dependencies luxon
        run: npm install luxon
      

      - name: Generate static HTML
        run: node generate_page.js

      - name: List files (debug)
        run: ls -alh

      - name: Setup Git user
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./          # index.html staat in root
          publish_branch: gh-pages
          force_orphan: true       # maak nieuwe orphan branch om conflicts te voorkomen
